name: CI

on:
  push:
  pull_request:

jobs:
  docker-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up --detach

      - name: Check backend health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Check frontend responds
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend
          exit 1

      # Add backend pytest and frontend test commands here once tests exist.
      - name: Stop services
        if: always()
        run: docker compose down --volumes
