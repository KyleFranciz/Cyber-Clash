name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  docker-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up --detach

      - name: Check backend health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Check frontend responds
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend
          exit 1

      # Add backend pytest and frontend test commands here once tests exist.
      - name: Stop services
        if: always()
        run: docker compose down --volumes
